[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchdog-cctv"
version = "0.1.0"
description = "Owner-item tracking and interpretable theft-risk alerts for campus CCTV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
video = ["numpy>=1.26,<3", "opencv-python>=4.10,<5"]
vision = ["ultralytics>=8.3,<9", "lap>=0.5.12", "numpy>=1.26,<3", "opencv-python>=4.10,<5"]
eval = ["motmetrics>=1.4,<2", "numpy>=1.26,<3"]

[project.scripts]
watchdog = "watchdog_cctv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
